[tool.ruff]
line-length = 120
extend-exclude = ["data", "models"]

[tool.ruff.lint]
# Reglene velges eksplisitt, så en ny ruff-versjon ikke endrer hva som sjekkes: pyflakes (F) og de
# viktigste pycodestyle-reglene (E4, E7, E9). Semikolon mellom korte kall i plottekoden og
# variabelnavnet l er bevisste stilvalg.
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
