name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Installer avhengigheter
        run: pip install -r app/requirements.txt pytest==9.1.1 ruff==0.16.9
      - name: Lint (ruff)
        run: ruff check .
      - name: Tester (enhetstester og røyktest av appen)
        run: pytest -q
